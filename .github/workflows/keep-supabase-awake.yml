# פרויקטים בתוכנית החינם של Supabase נכנסים לשינה אחרי ~7 ימים ללא פעילות.
# הוורקפלואו הזה שולח בקשת קריאה קטנה פעמיים ביום כדי שהפרויקט יישאר ער.
#
# המפתח כאן הוא anon key — הוא ממילא גלוי ב-index.html שכל אחד יכול לקרוא,
# ולכן אין טעם להחביא אותו ב-GitHub Secret. ההגנה אמורה להגיע מהרשאות ה-RLS בשרת.

name: Keep Supabase awake

on:
  schedule:
    - cron: "41 6 * * *"   # 06:41 UTC מדי יום
    - cron: "41 18 * * *"  # 18:41 UTC מדי יום
  workflow_dispatch:

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://wayigvagjucphixkcsim.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndheWlndmFnanVjcGhpeGtjc2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTQzODIsImV4cCI6MjA5MTU5MDM4Mn0.kCOxuQj8-szUOWg66-c6YVL45g8yjI0s941zGmrX35g
    steps:
      - name: Query the materials table
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /tmp/response.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/materials?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}")

          echo "HTTP $code"
          cat /tmp/response.json
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Supabase returned HTTP $code — the project may be paused. Restore it at https://supabase.com/dashboard/project/wayigvagjucphixkcsim"
            exit 1
          fi

          echo "::notice::Supabase project is awake."
